included:
  - Sources
  - Tests

excluded:
  - .build
  - docs
  - Package.swift

# Disabled rules — match SwiftProjectLint's policy on "whitelist" terminology.
# SwiftEffectInference inherits one local identifier (`onWhitelist` in
# CallSiteEffectInferrer) from the SPL lift; the term is product-historical
# rather than worth churning the diff for.
disabled_rules:
  - inclusive_language

# Opt-in rules — every opt-in lint rule except the ones logged in the
# "SwiftLint Exclusions" notes (Obsidian: LLM inspired Projects / SwiftLint
# Rule Notes). Those left out on purpose, by the notes' categories:
#   Fights Swift idioms:  explicit_acl, explicit_top_level_acl,
#     explicit_type_interface, no_magic_numbers, prefixed_toplevel_constant,
#     anonymous_argument_in_multiline_closure, switch_case_on_newline,
#     conditional_returns_on_newline, indentation_width,
#     vertical_whitespace_opening_braces, multiline_arguments,
#     multiline_call_arguments, discouraged_default_parameter
#   High churn:           type_contents_order, one_declaration_per_file,
#     required_deinit
#   Framework misfit:     private_outlet, discouraged_optional_collection
#   Conflicting rules:    contrasted_opening_brace (vs opening_brace),
#     no_extension_access_modifier (vs extension_access_modifier),
#     explicit_enum_raw_value / raw_value_for_camel_cased_codable_enum
#     (vs redundant_string_enum_value)
#   Other:                single_test_class, unneeded_throws_rethrows
#   Never act on it:      sorted_enum_cases — the re-order destroys ordinal
#     enums; see SwiftLint Never Autofix / sorted_enum_cases.
#
# Enabled here although the notes exclude them: their reasons are another
# project's (SwiftUMLStudio fixtures, ViewInspector, SwiftUI property wrappers,
# a config round-tripper, an app with no external consumers), they have no hits
# here, and incompatible_concurrency_annotation's own "reconsider" trigger, a
# distributable package, is this one: async_without_await, attributes,
# discouraged_optional_boolean, incompatible_concurrency_annotation,
# private_subject.
#
# Run `--fix` with .swiftlint.nofix.yml stacked on: some correctors here are
# wrong (see that file).
opt_in_rules:
  - accessibility_label_for_image
  - accessibility_trait_for_button
  - array_init
  - async_without_await
  - attributes
  - balanced_xctest_lifecycle
  - closure_body_length
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - comma_inheritance
  - contains_over_filter_count
