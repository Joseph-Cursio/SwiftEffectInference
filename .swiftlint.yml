# Identifier name — match SwiftInferProperties / SwiftProtocolLaws relaxations
# plus `lub` (lattice least-upper-bound, fundamental to this library).
identifier_name:
  excluded:
    - id
    - lub
  max_length: 50

# Adjustments — rules kept on and tuned (see "SwiftLint Adjustments").
trailing_comma:
  mandatory_comma: true

# Empty closures are the point at a no-op callback site; empty functions,
# initializers and statement blocks still need a comment saying why.
no_empty_block:
  disabled_block_types:
    - closure_blocks
